<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Farm Twin — Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="map"></canvas>
  <aside id="side-panel">
    <header id="panel-header">
      <span class="brand">Farm Twin</span>
      <span class="conn" data-field="conn"><span class="conn-dot"></span>Offline</span>
    </header>

    <section id="mission-section" class="section">
      <h2>Mission</h2>
      <div class="row"><span class="row-label">Status</span><b data-field="state" class="badge">—</b></div>
      <div class="row" data-row="battery"><span class="row-label">Battery</span><b data-field="battery">—</b></div>
      <div class="meter"><div class="meter-fill" data-field="battery-bar"></div></div>
      <div class="row"><span class="row-label">Progress</span><b data-field="progress">—</b></div>
      <div class="meter"><div class="meter-fill" data-field="progress-bar"></div></div>
      <div class="row"><span class="row-label">Driving to</span><b data-field="current">—</b></div>
      <ul data-field="waypoints"></ul>
      <button id="start-nav-btn" type="button">Start Navigation</button>
      <div class="battery-set">
        <label for="set-battery-input">Set battery:</label>
        <input id="set-battery-input" type="number" min="0" max="100" step="1"
               placeholder="0-100" inputmode="decimal">
        <button id="set-battery-btn" type="button">Apply</button>
      </div>
    </section>

    <section id="twin-section" class="section">
      <h2>Twin Status</h2>
      <div class="row" data-row="robot-state"><span class="row-label">Robot</span><b data-field="robot-state" class="badge">—</b></div>
      <div class="row"><span class="row-label">Position</span><b data-field="robot-position" class="mono">—</b></div>
      <div class="row"><span class="row-label">Goal</span><b data-field="robot-goal">—</b></div>
      <div class="row"><span class="row-label">Sync error</span><b data-field="sync-error" class="mono">—</b></div>
      <div class="row"><span class="row-label">Zones visited</span><b data-field="zones-visited" class="mono">—</b></div>
    </section>

    <section id="actions-section" class="section">
      <h2>Actions</h2>
      <div class="summary">
        <div class="stat spray"><b data-field="spray-count">0</b><span>Spray</span></div>
        <div class="stat fertilize"><b data-field="fert-count">0</b><span>Fertilize</span></div>
      </div>
      <ol data-field="action-list"></ol>
    </section>
  </aside>
  <script src="app.js"></script>
</body>
</html>
